<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="$description">
  <title>$page_title</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="elite-site">
  <header class="elite-header">
    <div class="elite-shell elite-header-inner">
      <a class="elite-brand" href="index.html" aria-label="$site_name, inicio">
        <img class="elite-salesforce-logo" src="assets/salesforce-logo.jpg" alt="Salesforce" width="120" height="68">
        <span><span class="elite-brand-name">$brand</span><span class="elite-brand-sub">$subtitle</span></span>
        <span class="elite-year">$year</span>
      </a>
      <nav class="elite-nav" aria-label="Navegación principal">$navigation</nav>
    </div>
  </header>
  <main>$body</main>
  <footer class="elite-footer"><div class="elite-shell elite-footer-inner"><span>$site_name · $year</span><span>$footer</span></div></footer>
</div>
</body>
</html>
